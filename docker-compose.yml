services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidlens}
      POSTGRES_USER: ${POSTGRES_USER:-aidlens}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidlens} -d ${POSTGRES_DB:-aidlens}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aidlens_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      AIDLENS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aidlens}@db:5432/${POSTGRES_DB:-aidlens}
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  aidlens_pgdata:
